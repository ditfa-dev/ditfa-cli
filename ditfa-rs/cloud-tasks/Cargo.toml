[package]
edition.workspace = true
license.workspace = true
name = "ditfa-cloud-tasks"
version.workspace = true

[lib]
name = "ditfa_cloud_tasks"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
ditfa-http-client = { workspace = true }
ditfa-cloud-tasks-client = { workspace = true }
# TODO: ditfa-cloud-tasks-mock-client should be in dev-dependencies.
ditfa-cloud-tasks-mock-client = { workspace = true }
ditfa-core = { workspace = true }
ditfa-git-utils = { workspace = true }
ditfa-login = { path = "../login" }
ditfa-model-provider = { workspace = true }
ditfa-tui = { workspace = true }
ditfa-utils-cli = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
http = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
ratatui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-stream = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-width = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
