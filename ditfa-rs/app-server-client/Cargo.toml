[package]
name = "ditfa-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ditfa_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
ditfa-app-server = { workspace = true }
ditfa-app-server-protocol = { workspace = true }
ditfa-arg0 = { workspace = true }
ditfa-config = { workspace = true }
ditfa-core = { workspace = true }
ditfa-exec-server = { workspace = true }
ditfa-feedback = { workspace = true }
ditfa-protocol = { workspace = true }
ditfa-uds = { workspace = true }
ditfa-utils-absolute-path = { workspace = true }
ditfa-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
