[package]
edition.workspace = true
license.workspace = true
name = "ditfa-goal-extension"
version.workspace = true

[lib]
name = "ditfa_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
ditfa-analytics = { workspace = true }
ditfa-core = { workspace = true }
ditfa-extension-api = { workspace = true }
ditfa-otel = { workspace = true }
ditfa-protocol = { workspace = true }
ditfa-state = { workspace = true }
ditfa-tools = { workspace = true }
ditfa-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
