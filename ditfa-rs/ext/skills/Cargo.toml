[package]
edition.workspace = true
license.workspace = true
name = "ditfa-skills-extension"
version.workspace = true

[lib]
name = "ditfa_skills_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
ditfa-core-skills = { workspace = true }
ditfa-exec-server = { workspace = true }
ditfa-extension-api = { workspace = true }
ditfa-mcp = { workspace = true }
ditfa-otel = { workspace = true }
ditfa-protocol = { workspace = true }
ditfa-skills = { workspace = true }
ditfa-tools = { workspace = true }
ditfa-utils-path-uri = { workspace = true }
ditfa-utils-string = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
ditfa-models-manager = { workspace = true }
ditfa-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
