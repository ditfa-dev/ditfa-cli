[package]
edition.workspace = true
license.workspace = true
name = "ditfa-memories-extension"
version.workspace = true

[lib]
name = "ditfa_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
ditfa-core = { workspace = true }
ditfa-extension-api = { workspace = true }
ditfa-features = { workspace = true }
ditfa-otel = { workspace = true }
ditfa-tools = { workspace = true }
ditfa-utils-absolute-path = { workspace = true }
ditfa-utils-output-truncation = { workspace = true }
ditfa-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
