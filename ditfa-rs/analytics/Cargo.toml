[package]
edition.workspace = true
license.workspace = true
name = "ditfa-analytics"
version.workspace = true

[lib]
doctest = false
name = "ditfa_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
ditfa-app-server-protocol = { workspace = true }
ditfa-git-utils = { workspace = true }
ditfa-login = { workspace = true }
ditfa-model-provider = { workspace = true }
ditfa-plugin = { workspace = true }
ditfa-protocol = { workspace = true }
ditfa-state = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
ditfa-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
