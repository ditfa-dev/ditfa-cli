[package]
edition.workspace = true
license.workspace = true
name = "ditfa-rollout"
version.workspace = true

[lib]
doctest = false
name = "ditfa_rollout"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ditfa-extension-items = { workspace = true }
ditfa-file-search = { workspace = true }
ditfa-git-utils = { workspace = true }
ditfa-otel = { workspace = true }
ditfa-protocol = { workspace = true }
ditfa-state = { workspace = true }
ditfa-utils-absolute-path = { workspace = true }
ditfa-utils-path = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = [
    "formatting",
    "local-offset",
    "macros",
    "parsing",
] }
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "process",
    "rt",
    "sync",
    "time",
] }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
