name: VS Code extension

# Push a tag like `vscode-v0.2.0` to test the extension, attach the VSIX to a
# GitHub Release, and publish it to both registries in one job, so the VS Code
# Marketplace and Open VSX can never serve different builds.
#
# Marketplace: set the repository variable VSCE_TRUSTED_PUBLISHING=true once the
# publisher trusts this workflow, or provide the VSCE_PAT secret.
# Open VSX: provide the OVSX_PAT secret.
# A registry with no credentials is skipped; the GitHub Release always happens.

on:
  pull_request:
    paths: ["ditfa-vscode/**", ".github/workflows/vscode-extension.yml"]
  push:
    tags: ["vscode-v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  check:
    name: Test and package
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ditfa-vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ditfa-vscode/pnpm-lock.yaml
      - run: pnpm install --ignore-workspace --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Package
        run: pnpm run package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vsix
          path: ditfa-vscode/*.vsix
          if-no-files-found: error

  publish:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vsix
          path: dist
      - name: Check the tag matches the manifest
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          manifest=$(node -p "require('./ditfa-vscode/package.json').version")
          [ "$version" = "$manifest" ] || { echo "tag $version, manifest $manifest"; exit 1; }
          test -f "dist/ditfa-code-$version.vsix"
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          (cd dist && sha256sum "ditfa-code-$version.vsix" > "ditfa-code-$version.vsix.sha256")
          {
            printf '## Install\n\n'
            printf 'Download `ditfa-code-%s.vsix` below, then run:\n\n' "$version"
            printf '```bash\ncode --install-extension ditfa-code-%s.vsix\n```\n\n' "$version"
            printf 'In Cursor, Windsurf, or VSCodium, use **Extensions: Install from VSIX**.\n'
            printf 'Open **Ditfa** in the activity bar and it sets up the rest.\n\n'
            awk -v heading="## [$version]" \
              'index($0, "## [") == 1 { if (found) exit; found = index($0, heading) == 1; next } found' \
              ditfa-vscode/CHANGELOG.md
          } > dist/notes.md
          grep -q '^### ' dist/notes.md || { echo "CHANGELOG has no entry for $version"; exit 1; }
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # `--latest=false`: the CLI install scripts follow the repository's latest release.
        run: |
          version="${GITHUB_REF_NAME#vscode-v}"
          gh release create "$GITHUB_REF_NAME" "dist/ditfa-code-$version.vsix" "dist/ditfa-code-$version.vsix.sha256" \
            --title "Ditfa $version for VS Code" \
            --notes-file dist/notes.md \
            --verify-tag \
            --latest=false
      - name: VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TRUSTED: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
        run: |
          if [ "$TRUSTED" = "true" ]; then
            npx --yes @vscode/vsce publish --packagePath "dist/ditfa-code-${GITHUB_REF_NAME#vscode-v}.vsix" --oidc
          elif [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath "dist/ditfa-code-${GITHUB_REF_NAME#vscode-v}.vsix"
          else
            echo "No Marketplace credentials; skipped."
          fi
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish "dist/ditfa-code-${GITHUB_REF_NAME#vscode-v}.vsix" -p "$OVSX_PAT"
          else
            echo "No Open VSX token; skipped."
          fi
