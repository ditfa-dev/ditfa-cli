version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /ditfa-rs
      - /tools/argument-comment-lint
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-patches:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: npm
    directories:
      - /
      - /ditfa-vscode
      - /sdk/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-patches:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      routine-patches:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
